name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set Node version to 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Run lint and format checks
        run: npm run check

      - name: Run unit, contract, and package tests
        run: npm run test

      - name: Build package
        run: npm run build

  e2e:
    uses: ./.github/workflows/e2e.yml

  service-smoke:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set Node version to 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Validate native macOS authorization script
        if: runner.os == 'macOS'
        run: npm run test -- src/service-install-macos.spec.ts

      - run: npm run build

      - name: Install, probe, and remove the platform startup service
        env:
          VITE_LOCAL_TLS_DISPOSABLE_SERVICE_SMOKE: 'true'
        run: node scripts/verify-service-platform.mjs
